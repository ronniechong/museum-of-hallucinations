name: Refresh vote tallies

on:
  schedule:
    # Every 3 days at 00:00 UTC. Cron has no native "every N days" concept
    # tied to a start date, so this is the conventional day-of-month
    # approximation (fires on 1, 4, 7, ... 31, then wraps) — good enough for
    # a low-traffic tally refresh, not a precision-timed job.
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shares the "pages" concurrency group with deploy.yml so the two workflows
# never race each other for a GitHub Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - run: uv sync
        working-directory: scripts

      - run: uv run python vote_tallies.py
        working-directory: scripts
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

      - name: Commit tally refresh
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/vote_tallies.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No vote tally changes."
            exit 0
          fi
          git commit -m "chore(votes): refresh vote tallies"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Everything below only runs when the tally actually changed — this
      # workflow builds and deploys the site itself, entirely separate from
      # deploy.yml, so a tally refresh never shows up in that workflow's
      # history and a real code change never waits on this one.
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        if: steps.commit.outputs.changed == 'true'
        working-directory: site

      - run: npm run build
        if: steps.commit.outputs.changed == 'true'
        working-directory: site

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: site/dist

      - id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
